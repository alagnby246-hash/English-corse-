<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تعلّم الإنجليزي من الصفر</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1b2030;--mut:#6b7385;--pri:#2f6bff;--ok:#1fa463;--bad:#d93f3f;--bd:#e3e6ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c202c;--tx:#eef0f6;--mut:#9aa2b5;--pri:#6c93ff;--ok:#3fcf8a;--bad:#ff6b6b;--bd:#2b3042}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c202c;--tx:#eef0f6;--mut:#9aa2b5;--pri:#6c93ff;--ok:#3fcf8a;--bad:#ff6b6b;--bd:#2b3042}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.les{cursor:pointer;text-align:center}
.les .ic{font-size:30px}
.les b{display:block;margin-top:4px}
.bar{height:6px;background:var(--bd);border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--pri);color:#fff}
button.g{background:transparent;color:var(--pri);border:1px solid var(--bd)}
.top{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.top h1{flex:1;margin:0}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1}
.w{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.w .b{min-width:44px;height:44px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-weight:700;direction:ltr}
.w .t{flex:1}
.en{font-size:19px;font-weight:600;direction:ltr;text-align:right}
.ar{color:var(--mut);font-size:15px}
.sp{width:44px;height:44px;padding:0;font-size:18px}
.q{text-align:center}
.q .big{font-size:26px;font-weight:700;direction:ltr;margin:10px 0}
.opt{display:block;width:100%;margin-top:8px;background:var(--card);color:var(--tx);border:1px solid var(--bd);text-align:center}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.res{text-align:center;font-size:18px}
.res .n{font-size:46px;font-weight:800;color:var(--pri)}
a.vid{display:block;text-align:center;text-decoration:none;color:var(--pri);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:12px;background:var(--card)}
h2{font-size:16px;margin:18px 0 8px;color:var(--mut)}.gc{background:var(--bg);border-style:dashed;margin:14px 0 8px}.gc p{margin:6px 0 0;font-size:15px}.gc b{color:var(--pri)}
.note{font-size:12px;color:var(--mut);margin-top:10px;text-align:center}
</style>
</head>
<body>
<main id="app"></main>
<script>
const A=[["Apple","تفاحة","A a"],["Book","كتاب","B b"],["Cat","قطة","C c"],["Dog","كلب","D d"],["Egg","بيضة","E e"],["Fish","سمكة","F f"],["Girl","بنت","G g"],["House","بيت","H h"],["Ice","ثلج","I i"],["Juice","عصير","J j"],["Key","مفتاح","K k"],["Lion","أسد","L l"],["Moon","قمر","M m"],["Nose","أنف","N n"],["Orange","برتقال","O o"],["Pen","قلم","P p"],["Queen","ملكة","Q q"],["Rain","مطر","R r"],["Sun","شمس","S s"],["Tree","شجرة","T t"],["Umbrella","شمسية","U u"],["Violin","كمان","V v"],["Water","مياه","W w"],["Xylophone","زيلوفون","X x"],["Yellow","أصفر","Y y"],["Zebra","حمار وحشي","Z z"]];
const L=[
{id:"abc",t:"الحروف",ic:"🔤",yt:"learn English alphabet for beginners arabic",i:A.map(x=>[...x,1])},
{id:"num",t:"الأرقام",ic:"🔢",yt:"learn English numbers 1 to 10 for beginners",i:[["One","واحد","1"],["Two","اتنين","2"],["Three","تلاتة","3"],["Four","أربعة","4"],["Five","خمسة","5"],["Six","ستة","6"],["Seven","سبعة","7"],["Eight","تمانية","8"],["Nine","تسعة","9"],["Ten","عشرة","10"]]},
{id:"hi",t:"التحيات",ic:"👋",yt:"English greetings for beginners",i:[["Hello","مرحبا"],["Hi","أهلا"],["Good morning","صباح الخير"],["Good evening","مساء الخير"],["Good night","تصبح على خير"],["Goodbye","مع السلامة"],["Please","من فضلك"],["Thank you","شكرا"],["Sorry","آسف"],["Welcome","أهلا بيك"]]},
{id:"col",t:"الألوان",ic:"🎨",yt:"learn colors in English for beginners",i:[["Red","أحمر"],["Blue","أزرق"],["Green","أخضر"],["Yellow","أصفر"],["Black","أسود"],["White","أبيض"],["Orange","برتقالي"],["Pink","وردي"],["Brown","بني"],["Purple","بنفسجي"]]},
{id:"fam",t:"العيلة",ic:"👨‍👩‍👧",yt:"family members vocabulary English beginners",i:[["Mother","أم"],["Father","أب"],["Brother","أخ"],["Sister","أخت"],["Son","ابن"],["Daughter","بنت"],["Grandfather","جد"],["Grandmother","جدة"],["Uncle","عم / خال"],["Aunt","عمة / خالة"]]},
{id:"ph",t:"جمل يومية",ic:"💬",yt:"basic English sentences for beginners arabic",i:[["How are you?","عامل إيه؟"],["I’m fine","أنا كويس"],["What is your name?","اسمك إيه؟"],["My name is Ali","اسمي علي"],["Nice to meet you","تشرفت بيك"],["Where are you from?","إنت منين؟"],["I don’t understand","مش فاهم"],["Can you help me?","تقدر تساعدني؟"],["How much is this?","بكام ده؟"],["I love English","بحب الإنجليزي"]]},
{c:"قواعد",id:"ord",t:"ترتيب الجملة",ic:"🧩",yt:"English sentence structure for beginners",g:[
{h:"فاعل ← فعل ← باقي الجملة",p:"في العربي ممكن نبدأ بالفعل (أكل أحمد تفاحة). في الإنجليزي الترتيب ثابت: مين؟ بيعمل إيه؟ إيه؟ يعني الفاعل الأول وبعده الفعل وبعده المفعول.",ex:[["Ahmed eats an apple","أحمد بياكل تفاحة"],["I read a book","أنا بقرأ كتاب"],["She drinks tea","هي بتشرب شاي"]]},
{h:"الصفة قبل الاسم",p:"في العربي الصفة بعد الاسم (بيت كبير). في الإنجليزي الصفة قبله.",ex:[["A big house","بيت كبير"],["A red car","عربية حمرا"],["A good teacher","مدرس كويس"]]},
{h:"السؤال: الفعل المساعد الأول",p:"في السؤال بنحط do / does / is / are في أول الجملة، وبعده الفاعل ثم الفعل.",ex:[["Do you speak English","بتتكلم إنجليزي"],["Is she a doctor","هي دكتورة"],["Where do you live","إنت ساكن فين"]]},
{h:"النفي: not بعد الفعل المساعد",p:"بنحط don’t / doesn’t / isn’t قبل الفعل الأساسي، والفعل يفضل زي ما هو.",ex:[["I don’t like tea","مش بحب الشاي"],["He doesn’t work here","هو مبيشتغلش هنا"],["They aren’t at home","هم مش في البيت"]]}]},
{c:"قواعد",id:"be",t:"am / is / are",ic:"🅱️",yt:"verb to be am is are for beginners",g:[{h:"فعل الكينونة لازم يتكتب",p:"في العربي نقول «أنا طالب» من غير فعل. في الإنجليزي لازم: I am / he, she, it is / you, we, they are.",ex:[["I am a student","أنا طالب"],["She is a teacher","هي مدرسة"],["He is at home","هو في البيت"],["We are friends","احنا أصحاب"],["They are happy","هم سعداء"]]}]},
{c:"قواعد",id:"pres",t:"المضارع البسيط",ic:"⏰",yt:"present simple for beginners",g:[{h:"للعادات والحقايق",p:"علامته: always, every day, usually. مع he / she / it بنزود s أو es للفعل.",ex:[["I work every day","بشتغل كل يوم"],["She works in a bank","هي بتشتغل في بنك"],["He goes to school","هو بيروح المدرسة"],["The sun rises in the east","الشمس بتطلع من الشرق"]]}]},
{c:"قواعد",id:"cont",t:"المضارع المستمر",ic:"▶️",yt:"present continuous for beginners",g:[{h:"am/is/are + فعل + ing",p:"للحاجة اللي بتحصل دلوقتي. علامته: now, at the moment, today.",ex:[["I am studying now","أنا بذاكر دلوقتي"],["She is eating lunch","هي بتاكل الغدا"],["They are playing football","هم بيلعبوا كورة"],["It is raining","الدنيا بتمطر"]]}]},
{c:"قواعد",id:"past",t:"الماضي البسيط",ic:"⏪",yt:"past simple for beginners",g:[{h:"فعل + ed (المنتظم)",p:"للحاجة اللي خلصت. علامته: yesterday, last week, ago. play ← played.",ex:[["I played football yesterday","لعبت كورة امبارح"],["We watched a movie","شفنا فيلم"]]},{h:"أفعال شاذة (لازم تتحفظ)",p:"go ← went, eat ← ate, see ← saw. وفي السؤال والنفي بنستخدم did والفعل يرجع عادي.",ex:[["She went to Cairo","هي راحت القاهرة"],["He ate breakfast","هو فطر"],["Did you see him","شفته"]]}]},
{c:"قواعد",id:"fut",t:"المستقبل",ic:"⏩",yt:"future will going to for beginners",g:[{h:"will + فعل",p:"للقرارات السريعة والتوقعات. علامته: tomorrow, next week, soon.",ex:[["I will call you tomorrow","هكلمك بكرة"],["It will rain tonight","هتمطر الليلة"]]},{h:"am/is/are going to + فعل",p:"للخطط اللي اتقررت قبل كده.",ex:[["I am going to study tonight","هذاكر الليلة"],["We are going to travel","هنسافر"]]}]},
{c:"قواعد",id:"art",t:"a / an / the",ic:"🔠",yt:"articles a an the for beginners",g:[{h:"a و an: حاجة واحدة غير معينة",p:"an قبل الكلمة اللي بتبدأ بصوت متحرك، و a قبل الباقي. الصوت هو المهم مش الحرف: an hour لأن h ساكتة.",ex:[["A book","كتاب"],["An apple","تفاحة"],["An hour","ساعة"],["A university","جامعة"]]},{h:"the: حاجة معروفة للطرفين",p:"بنقول the لما المتكلم والسامع يعرفوا إحنا بنتكلم عن إيه.",ex:[["The sun is hot","الشمس حرّة"],["Open the door","افتح الباب"]]}]},
{c:"قواعد",id:"plu",t:"الجمع",ic:"➕",yt:"English plural nouns for beginners",g:[{h:"s أو es أو ies",p:"الأغلب نزود s. لو بتنتهي بـ s, x, ch, sh نزود es. لو بتنتهي بـ y بعد حرف ساكن نقلبها ies.",ex:[["Books","كتب"],["Boxes","صناديق"],["Babies","أطفال رضع"]]},{h:"جموع شاذة",p:"لازم تتحفظ: man ← men، child ← children.",ex:[["Men","رجالة"],["Children","أطفال"],["Feet","أقدام"]]}]},
{c:"قواعد",id:"prep",t:"حروف الجر",ic:"📍",yt:"prepositions in on at for beginners",g:[{h:"in / on / at",p:"in: جوه حاجة (بلد، شهر). on: فوق سطح أو يوم. at: نقطة محددة أو ساعة.",ex:[["I live in Cairo","أنا ساكن في القاهرة"],["The book is on the table","الكتاب على الترابيزة"],["See you at five","نشوفك الساعة خمسة"],["The exam is on Monday","الامتحان يوم الاتنين"]]}]},
{c:"قواعد",id:"wh",t:"أدوات السؤال",ic:"❓",yt:"wh questions for beginners",g:[{h:"What / Where / When / Who / Why / How",p:"أداة السؤال الأول، بعدها الفعل المساعد، ثم الفاعل: Where + do + you + live.",ex:[["What is this","ده إيه"],["When is the exam","الامتحان إمتى"],["Who is he","هو مين"],["Why are you late","ليه إنت متأخر"],["How old are you","عندك كام سنة"]]}]},
{c:"نطق",id:"sil",t:"الحروف الساكتة",ic:"🤫",yt:"silent letters in English",g:[
{h:"K قبل N",p:"الحرف اللي في المربع هو اللي مش بيتنطق. في kn حرف k ساكت: بنقول «نايف» مش «كنايف».",ex:[["Knife","سكينة","k"],["Know","يعرف","k"],["Knee","ركبة","k"]]},
{h:"W قبل R",p:"في بداية الكلمة wr، حرف w ساكت.",ex:[["Write","يكتب","w"],["Wrong","غلط","w"],["Wrist","رسغ","w"]]},
{h:"B بعد M في الآخر",p:"mb في آخر الكلمة، حرف b ساكت.",ex:[["Lamb","خروف 🐑","b"],["Thumb","إبهام","b"],["Climb","يتسلق","b"]]},
{h:"GH",p:"في igh و ough غالبا gh ساكتين.",ex:[["Night","ليل","gh"],["Light","نور","gh"],["Daughter","بنت","gh"]]},
{h:"L قبل k, m, f",p:"في alk و alf حرف l ساكت.",ex:[["Walk","يمشي","l"],["Talk","يتكلم","l"],["Half","نص","l"]]},
{h:"E في آخر الكلمة",p:"e ساكتة بس بتخلي الحرف اللي قبلها يتنطق طويل.",ex:[["Name","اسم","e"],["Like","يحب","e"],["Home","بيت","e"]]},
{h:"H ساكتة في كلمات معينة",p:"احفظها: hour, honest, heir.",ex:[["Hour","ساعة","h"],["Honest","أمين","h"],["Heir","وريث","h"]]},
{h:"T في النص",p:"في listen و castle و often حرف t ساكت.",ex:[["Listen","يسمع","t"],["Castle","قلعة","t"],["Often","كتير","t"]]}]},
{c:"مفردات",id:"day",t:"الأيام",ic:"📅",yt:"days of the week English for beginners",i:[["Monday","الاتنين"],["Tuesday","التلات"],["Wednesday","الأربع"],["Thursday","الخميس"],["Friday","الجمعة"],["Saturday","السبت"],["Sunday","الحد"],["Today","النهارده"],["Tomorrow","بكرة"],["Yesterday","امبارح"]]},
{c:"مفردات",id:"verb",t:"أفعال مهمة",ic:"🏃",yt:"common English verbs for beginners",i:[["Go","يروح"],["Come","يجي"],["Eat","ياكل"],["Drink","يشرب"],["Sleep","ينام"],["Read","يقرأ"],["Write","يكتب"],["Speak","يتكلم"],["Listen","يسمع"],["Study","يذاكر"],["Work","يشتغل"],["Play","يلعب"],["Buy","يشتري"],["Open","يفتح"]]},
{c:"مفردات",id:"food",t:"الأكل والشرب",ic:"🍽️",yt:"food vocabulary English beginners",i:[["Bread","عيش"],["Rice","رز"],["Milk","لبن"],["Tea","شاي"],["Coffee","قهوة"],["Meat","لحمة"],["Chicken","فراخ"],["Cheese","جبنة"],["Potato","بطاطس"],["Tomato","طماطم"],["Banana","موز"]]},
{c:"مفردات",id:"body",t:"الجسم",ic:"🧍",yt:"body parts English for beginners",i:[["Head","راس"],["Eye","عين"],["Ear","ودن"],["Mouth","بوق"],["Hand","إيد"],["Leg","رجل"],["Foot","قدم"],["Heart","قلب"],["Hair","شعر"],["Tooth","سنة"]]},
{c:"مفردات",id:"adj",t:"صفات",ic:"✨",yt:"common adjectives English beginners",i:[["Big","كبير"],["Small","صغير"],["Hot","سخن"],["Cold","بارد"],["New","جديد"],["Old","قديم"],["Fast","سريع"],["Slow","بطيء"],["Happy","سعيد"],["Sad","حزين"],["Beautiful","جميل"]]},
{c:"مفردات",id:"job",t:"المهن",ic:"👩‍⚕️",yt:"jobs vocabulary English beginners",i:[["Doctor","دكتور"],["Teacher","مدرس"],["Engineer","مهندس"],["Driver","سواق"],["Nurse","ممرضة"],["Farmer","فلاح"],["Policeman","شرطي"],["Cook","طباخ"],["Student","طالب"],["Worker","عامل"]]}
];
L.forEach(l=>{if(l.g)l.i=l.g.flatMap(g=>g.ex.map((x,k)=>[x[0],x[1],x[2]||"",0,k?0:g]))});
let P={};try{P=JSON.parse(localStorage.getItem("eng")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("eng",JSON.stringify(P))}catch(e){}};
const $=document.getElementById("app");
const sh=a=>[...a].sort(()=>Math.random()-.5);
let V=[],warned=0;const lv=()=>{try{V=speechSynthesis.getVoices()}catch(e){}};lv();try{speechSynthesis.onvoiceschanged=lv}catch(e){}
function warn(){if(warned++)return;alert("الصوت مش شغال على المتصفح ده. جرّب: 1) صوت الوسائط عالي والموبايل مش على الصامت 2) افتح الصفحة من Chrome أو Safari 3) فعّل محرك نطق Text-to-speech إنجليزي من إعدادات الموبايل.")}
function mk(t,r){const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=r||.85;const v=V.find(x=>x.lang.replace("_","-")==="en-US")||V.find(x=>x.lang.toLowerCase().startsWith("en"));if(v)u.voice=v;u.onerror=e=>{if(e.error!=="canceled"&&e.error!=="interrupted")warn()};return u}
function say(t,r){if(!window.speechSynthesis){warn();return}try{lv();speechSynthesis.cancel();speechSynthesis.resume();speechSynthesis.speak(mk(t,r))}catch(e){warn()}}
const sp=i=>(i[3]?i[2][0]+". ":"")+i[0];
window.say=say;
function home(){
$.innerHTML=`<h1>🎓 تعلّم الإنجليزي من الصفر</h1><p class="sub">ابدأ بالأساسيات، بعدها القواعد والنطق. اضغط 🔊 عشان تسمع.</p>${["أساسيات","قواعد","نطق","مفردات"].map(ct=>`<h2>${ct}</h2><div class="grid">${L.filter(l=>(l.c||"أساسيات")===ct).map(l=>`<div class="card les" data-id="${l.id}"><div class="ic">${l.ic}</div><b>${l.t}</b><small class="ar">${l.i.length} كلمة${P[l.id]!=null?" · أفضل نتيجة "+P[l.id]+"%":""}</small><div class="bar"><i style="width:${P[l.id]||0}%"></i></div></div>`).join("")}</div>`).join("")}`;
$.querySelectorAll(".les").forEach(e=>e.onclick=()=>lesson(e.dataset.id));
}
function lesson(id,tab){
const l=L.find(x=>x.id===id);
$.innerHTML=`<div class="top"><button class="g" id="bk">→</button><h1>${l.ic} ${l.t}</h1></div>
<div class="tabs"><button id="t1" class="${tab?"g":""}">📖 تعلّم</button><button id="t2" class="${tab?"":"g"}">📝 امتحان</button></div><div id="c"></div>`;
$.querySelector("#bk").onclick=home;
$.querySelector("#t1").onclick=()=>lesson(id,0);
$.querySelector("#t2").onclick=()=>quiz(l);
learn(l,$.querySelector("#c"));
}
function learn(l,c){
$.querySelector("#t1").className="";$.querySelector("#t2").className="g";
c.innerHTML=`<a class="vid" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(l.yt)}">▶️ شوف فيديو الدرس على يوتيوب</a>`+l.i.map((x,n)=>(x[4]?`<div class="card gc"><b>${x[4].h}</b><p>${x[4].p}</p></div>`:"")+`<div class="card w"><div class="b">${x[2]||n+1}</div><div class="t"><div class="en">${x[0]}</div><div class="ar">${x[1]}</div></div><button class="sp" data-n="${n}" title="نطق">🔊</button><button class="sp g" data-s="${n}" title="ببطء">🐢</button></div>`).join("")+`<button style="width:100%" id="all">🎧 اسمع كل الكلمات</button>`;
c.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>say(sp(l.i[b.dataset.n])));
c.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>say(sp(l.i[b.dataset.s]),.45));
c.querySelector("#all").onclick=()=>{if(!window.speechSynthesis){warn();return}try{lv();speechSynthesis.cancel();speechSynthesis.resume();l.i.forEach(x=>speechSynthesis.speak(mk(sp(x),.8)))}catch(e){warn()}};
}
function quiz(l){
$.querySelector("#t2").className="";$.querySelector("#t1").className="g";
const c=$.querySelector("#c");const qs=sh(l.i).slice(0,8);let n=0,sc=0;
function order(q){const w=q[0].split(" "),bk=sh(w.map((x,i)=>[x,i])),a=[];
const draw=()=>{const d=a.length===w.length,ok=a.map(x=>x[0]).join(" ")===q[0];
c.innerHTML=`<div class="card q"><div class="ar">سؤال ${n+1} من ${qs.length}</div><p>🧩 رتّب الكلمات: <b>${q[1]}</b></p><div class="big" style="font-size:20px;min-height:36px;${d?"color:var(--"+(ok?"ok":"bad")+")":""}">${a.map(x=>x[0]).join(" ")||"…"}</div>${d?(ok?"":`<p class="ar">الصح: ${q[0]}</p>`):bk.filter(x=>!a.includes(x)).map(x=>`<button class="opt" style="display:inline-block;width:auto;margin:4px" data-i="${x[1]}">${x[0]}</button>`).join("")+(a.length?`<br><button class="g" id="cl">مسح</button>`:"")}</div>`;
if(d){if(ok)sc++;say(q[0]);n++;setTimeout(show,1800);return}
c.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{a.push(bk.find(x=>x[1]==b.dataset.i));draw()});
const cl=c.querySelector("#cl");if(cl)cl.onclick=()=>{a.length=0;draw()}};
draw()}
function show(){
if(n>=qs.length){const p=Math.round(sc/qs.length*100);if(p>(P[l.id]||0)){P[l.id]=p;save()}
c.innerHTML=`<div class="card res"><div class="n">${p}%</div><p>${p>=80?"ممتاز! 🎉":p>=50?"كويس، كمّل 💪":"حاول تاني بعد ما تراجع 📖"}</p><p class="ar">${sc} من ${qs.length}</p><button id="rt">إعادة الامتحان</button> <button class="g" id="hm">الدروس</button></div>`;
c.querySelector("#rt").onclick=()=>quiz(l);c.querySelector("#hm").onclick=home;return}
const q=qs[n];if(l.g&&n%3===2&&q[0].includes(" ")){order(q);return}const listen=n%2===0;
const opts=sh([q,...sh(l.i.filter(x=>x!==q)).slice(0,3)]);
c.innerHTML=`<div class="card q"><div class="ar">سؤال ${n+1} من ${qs.length}</div>${listen?`<p>🎧 اسمع واختار الكلمة الصح</p><button id="pl" class="sp" style="width:64px;height:64px;font-size:28px">🔊</button>`:`<p>ترجمة الكلمة دي إيه؟</p><div class="big">${q[0]}</div>`}<div id="o">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><span style="direction:ltr;display:inline-block">${listen?o[0]:""}</span>${listen?"":o[1]}</button>`).join("")}</div></div>`;
if(listen){const pl=c.querySelector("#pl");pl.onclick=()=>say(sp(q));setTimeout(()=>say(sp(q)),300)}
c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
const o=opts[b.dataset.k];c.querySelectorAll(".opt").forEach(x=>x.disabled=true);
if(o===q){sc++;b.classList.add("ok")}else{b.classList.add("no");c.querySelectorAll(".opt").forEach(x=>{if(opts[x.dataset.k]===q)x.classList.add("ok")})}
say(sp(q));n++;setTimeout(show,1400)});
}
show();
}
home();
</script>
</body>
</html>
